 href=\"#/nossa-historia/index.html\" class=\"text-link\" >Nossa história <svg class=\"icon\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 12h16M13 5l7 7-7 7\"/></svg></a><div class=\"since\"><span>1992</span><p>O ano em que<br>tudo começou.</p></div></div></section>\n <section class=\"section brands-section\"><div class=\"wrap\"><div class=\"section-heading reveal\"><div><p class=\"eyebrow\">IDENTIDADES QUE INSPIRAM</p><h2>Nossas marcas.</h2></div><a href=\"#/marcas/index.html\" class=\"text-link\" >Explore as marcas <svg class=\"icon\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 12h16M13 5l7 7-7 7\"/></svg></a></div><div class=\"brand-placeholder-list\"><div><span><svg class=\"icon\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 13a4 4 0 1 0 8 0 4 4 0 0 0-8 0ZM14 13a4 4 0 1 0 8 0 4 4 0 0 0-8 0ZM10 12c1-1 3-1 4 0M2 12l2-7h3M22 12l-2-7h-3\"/></svg></span><p>Óculos de grau</p><small>Marcas em preparação</small></div><div><span><svg class=\"icon\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 13a5 5 0 1 0 10 0 5 5 0 0 0-10 0ZM12 2v2M3 13H1M23 13h-2M5 6 3 4M19 6l2-2M5 20l-2 2M19 20l2 2M12 22v-2\"/></svg></span><p>Óculos de sol</p><small>Marcas em preparação</small></div><div><span><svg class=\"icon\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 7 8 1h8l1 6M7 17l1 6h8l1-6M5 12a7 7 0 1 0 14 0 7 7 0 0 0-14 0ZM12 8v4l3 2\"/></svg></span><p>Relógios</p><small>Marcas em preparação</small></div><div><span><svg class=\"icon\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 7l4-5h10l4 5-9 15L3 7ZM3 7h18M7 2l5 20 5-20\"/></svg></span><p>Semijoias</p><small>Marcas em preparação</small></div></div><p class=\"section-note\">A seleção de marcas e os modelos desta vitrine serão apresentados em breve.</p></div></section>\n <section class=\"lens-banner wrap reveal\"><div><p class=\"eyebrow\">LENTES OFTÁLMICAS</p><h2>Cada olhar tem<br>suas particularidades.</h2><p>Conte com orientação para escolher lentes que considerem sua prescrição e sua rotina.</p><a href=\"#/lentes/index.html\" class=\"text-link\" >Conheça a área de lentes <svg class=\"icon\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 12h16M13 5l7 7-7 7\"/></svg></a></div><figure><img class=\"\" src=\"pupila-asset:assets/images/atendimento.webp\" sizes=\"(max-width: 700px) 100vw, 50vw\" width=\"1152\" height=\"1536\" alt=\"Balcão de atendimento com expositores de relógios e semijoias\" loading=\"lazy\" decoding=\"async\"></figure></section>\n <section class=\"section wrap reviews-section\" id=\"avaliacoes\" aria-labelledby=\"reviews-title\">\n<div class=\"section-heading\"><div><p class=\"eyebrow\">QUEM CONHECE, RECOMENDA</p><h2 id=\"reviews-title\">O cuidado, nas palavras<br>de quem já veio.</h2></div><a href=\"https://maps.app.goo.gl/fx92AvEfJ51patQ48\" class=\"text-link\" target=\"_blank\" rel=\"noopener noreferrer\">Ver avaliações no Google <span aria-hidden=\"true\">↗</span></a></div>\n<div class=\"testimonials-grid\">\n<figure class=\"testimonial\"><span class=\"testimonial-mark\" aria-hidden=\"true\">“</span><blockquote><p>Quero agradecer imensamente pelo atendimento maravilhoso na ótica. A equipe foi super atenciosa, esclareceu todas as minhas dúvidas e me ajudou a escolher a armação perfeita. Recomendo de olhos fechados, sem trocadilho!</p></blockquote><figcaption>Depoimento de cliente</figcaption></figure>\n<figure class=\"testimonial\"><span class=\"testimonial-mark\" aria-hidden=\"true\">“</span><blockquote><p>Eu amo essa Ótica, saio de Curitiba pra fazer meus óculos nela, super bem atendida, atendimento nota mil, sem forçar compra, deixando super a vontade na escolha, só óculos top das galáxias e ainda o melhor preço! SUPER INDICO</p></blockquote><figcaption>Depoimento de cliente</figcaption></figure>\n</div></section>\n <section class=\"section faq-section\"><div class=\"wrap faq-layout\"><div><p class=\"eyebrow\">BOM SABER</p><h2>Um pouco mais<br>de clareza.</h2><p>Respostas simples para cuidar<br>dos seus óculos e do seu olhar.</p><a href=\"#/perguntas-frequentes/index.html\" class=\"text-link\" >Todas as perguntas <svg class=\"icon\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 12h16M13 5l7 7-7 7\"/></svg></a></div><div class=\"faq-list\"><details><summary>Como limpar as lentes dos meus óculos?<span aria-hidden=\"true\">+</span></summary><div class=\"faq-answer\"><p>Enxágue para retirar partículas, use um produto indicado para suas lentes ou uma pequena quantidade de detergente neutro, enxágue e seque com uma microfibra limpa. Evite água quente e siga as orientações do fabricante.</p><a href=\"https://www.zeiss.com/vision-care/en/eye-health-and-care/health-prevention/how-should-i-take-care-of-my-prescription-spectacle-lenses.html\" class=\"source-link\" target=\"_blank\" rel=\"noopener noreferrer\">Referência técnica ↗</a></div></details><details><summary>Posso limpar os óculos na roupa?<span aria-hidden=\"true\">+</span></summary><div class=\"faq-answer\"><p>Evite. O tecido e a poeira podem riscar as lentes. Prefira uma microfibra própria e limpa, retirando a sujeira antes de esfregar.</p><a href=\"https://www.zeiss.com/vision-care/en/eye-health-and-care/health-prevention/how-should-i-take-care-of-my-prescription-spectacle-lenses.html\" class=\"source-link\" target=\"_blank\" rel=\"noopener noreferrer\">Referência técnica ↗</a></div></details><details><summary>Lentes escuras garantem proteção UV?<span aria-hidden=\"true\">+</span></summary><div class=\"faq-answer\"><p>A cor, sozinha, não comprova proteção. Ao escolher os óculos solares, verifique a indicação de proteção UVA e UVB do fabricante, como 100% UV ou UV400.</p><a href=\"https://aao.org/eye-health/tips-prevention/sun\" class=\"source-link\" target=\"_blank\" rel=\"noopener noreferrer\">Referência técnica ↗</a></div></details><details><summary>Como guardar meus óculos?<span aria-hidden=\"true\">+</span></summary><div class=\"faq-answer\"><p>Use um estojo adequado e evite apoiar as lentes diretamente nas superfícies. Não deixe os óculos expostos ao calor intenso, como no painel de um carro.</p><a href=\"https://www.zeiss.com/vision-care/en/eye-health-and-care/health-prevention/how-should-i-take-care-of-my-prescription-spectacle-lenses.html\" class=\"source-link\" target=\"_blank\" rel=\"noopener noreferrer\">Referência técnica ↗</a></div></details><details><summary>Como escolher lentes e armações?<span aria-hidden=\"true\">+</span></summary><div class=\"faq-answer\"><p>Leve sua prescrição e conte à equipe como usa os óculos no dia a dia. A escolha deve considerar as orientações do profissional que acompanha sua visão, o ajuste e o conforto da armação.</p></div></details></div></div></section>\n <section class=\"section wrap location-layout\"><div class=\"reveal\"><p class=\"eyebrow\">PERTINHO DE VOCÊ</p><h2>Nos encontramos<br>no centro de Joinville.</h2><p class=\"address\">Rua Ab <span>Perguntas frequentes</span></nav><section class=\"page-intro wrap\"><p class=\"eyebrow\">CLAREZA PARA ESCOLHER</p><h1>Perguntas frequentes.</h1><p class=\"lede\">Orientações simples sobre óculos, lentes e atendimento.</p></section><section class=\"wrap faq-full\"><div class=\"faq-list\"><details><summary>Como limpar as lentes dos meus óculos?<span aria-hidden=\"true\">+</span></summary><div class=\"faq-answer\"><p>Enxágue para retirar partículas, use um produto indicado para suas lentes ou uma pequena quantidade de detergente neutro, enxágue e seque com uma microfibra limpa. Evite água quente e siga as orientações do fabricante.</p><a href=\"https://www.zeiss.com/vision-care/en/eye-health-and-care/health-prevention/how-should-i-take-care-of-my-prescription-spectacle-lenses.html\" class=\"source-link\" target=\"_blank\" rel=\"noopener noreferrer\">Referência técnica ↗</a></div></details><details><summary>Posso limpar os óculos na roupa?<span aria-hidden=\"true\">+</span></summary><div class=\"faq-answer\"><p>Evite. O tecido e a poeira podem riscar as lentes. Prefira uma microfibra própria e limpa, retirando a sujeira antes de esfregar.</p><a href=\"https://www.zeiss.com/vision-care/en/eye-health-and-care/health-prevention/how-should-i-take-care-of-my-prescription-spectacle-lenses.html\" class=\"source-link\" target=\"_blank\" rel=\"noopener noreferrer\">Referência técnica ↗</a></div></details><details><summary>Lentes escuras garantem proteção UV?<span aria-hidden=\"true\">+</span></summary><div class=\"faq-answer\"><p>A cor, sozinha, não comprova proteção. Ao escolher os óculos solares, verifique a indicação de proteção UVA e UVB do fabricante, como 100% UV ou UV400.</p><a href=\"https://aao.org/eye-health/tips-prevention/sun\" class=\"source-link\" target=\"_blank\" rel=\"noopener noreferrer\">Referência técnica ↗</a></div></details><details><summary>Como guardar meus óculos?<span aria-hidden=\"true\">+</span></summary><div class=\"faq-answer\"><p>Use um estojo adequado e evite apoiar as lentes diretamente nas superfícies. Não deixe os óculos expostos ao calor intenso, como no painel de um carro.</p><a href=\"https://www.zeiss.com/vision-care/en/eye-health-and-care/health-prevention/how-should-i-take-care-of-my-prescription-spectacle-lenses.html\" class=\"source-link\" target=\"_blank\" rel=\"noopener noreferrer\">Referência técnica ↗</a></div></details><details><summary>Como escolher lentes e armações?<span aria-hidden=\"true\">+</span></summary><div class=\"faq-answer\"><p>Leve sua prescrição e conte à equipe como usa os óculos no dia a dia. A escolha deve considerar as orientações do profissional que acompanha sua visão, o ajuste e o conforto da armação.</p></div></details><details><summary>O site substitui uma avaliação da visão?<span aria-hidden=\"true\">+</span></summary><div class=\"faq-answer\"><p>Não. As informações aqui são educativas e não oferecem diagnóstico. Dúvidas ou alterações na visão precisam ser avaliadas por um profissional habilitado.</p></div></details><details><summary>Posso comprar pelo site?<span aria-hidden=\"true\">+</span></summary><div class=\"faq-answer\"><p>Este site é uma vitrine da Ótica Pupila. Para conhecer os modelos e receber atendimento, entre em contato ou visite nossa loja em Joinville.</p></div></details><details><summary>Onde fica a loja e quais são os horários?<span aria-hidden=\"true\">+</span></summary><div class=\"faq-answer\"><p>Estamos na Rua Abdon Batista, 59, Centro, Joinville/SC. Atendemos de segunda a sexta, das 08h30 às 18h; aos sábados, até 12h30. Aos domingos, a loja está fechada.</p></div></details></div><p class=\"small\">Conteúdo educativo. Não substitui avaliação individual por profissional habilitado.</p></section></main><footer class=\"site-footer\"><div class=\"wrap footer-grid\"><div><a href=\"#/index.html\" class=\"footer-brand\" ><img src=\"pupila-asset:assets/images/logo-pupila.webp\" width=\"650\" height=\"318\" alt=\"Ótica Pupila\" class=\"brand-logo\" (function (scope) {
  'use strict';
  const normalize = value => String(value || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
  function filterProducts(items, filters = {}) {
    return items.filter(item => (!filters.category || item.category === filters.category)
      && (!filters.gender || item.gender === filters.gender || item.gender === 'unissex')
      && (!filters.brand || item.brand === filters.brand)
      && (!filters.query || normalize([item.name, item.code, item.brandName].join(' ')).includes(normalize(filters.query))));
  }
  function whatsappUrl(number, message) {
    if (!/^\d{10,15}$/.test(number || '')) return null;
    return 'https://wa.me/' + number + '?text=' + encodeURIComponent(message);
  }
  function productMessage(product) {
    return 'Olá! Vi o modelo ' + [product.brandName, product.code || product.name].filter(Boolean).join(' ') + ' no site da Ótica Pupila e gostaria de mais informações.';
  }
  scope.PupilaCatalog = { normalize, filterProducts, whatsappUrl, productMessage };
  if (typeof module !== 'undefined') module.exports = scope.PupilaCatalog;
})(typeof window !== 'undefined' ? window : globalThis);

      const fallback=document.createElement('span');fallback.className='image-error';fallback.textContent='Imagem temporariamente indisponível';fallback.setAttribute('role','img');fallback.setAttribute('aria-label',img.alt||fallback.textContent);img.replaceWith(fallback);
    }
  },true);
  window.PupilaInit=init;
  init();
})();

document.getElementById('pupila-app').addEventListener('click',function(event){
 const link=event.target.closest('a[href]');if(!link)return;
 const href=link.getAttribute('href');
 if(href==='#conteudo'){event.preventDefault();const main=document.getElementById('conteudo');main?.focus({preventScroll:true});main?.scrollIntoView({block:'start',behavior:'instant'});return;}
 if(href.startsWith('#/')&&!event.ctrlKey&&!event.metaKey&&!event.shiftKey&&!event.altKey&&event.button===0){event.preventDefault();window.PupilaNavigate(href.slice(2));}
});
window.addEventListener('popstate',event=>window.PupilaRender(window.PupilaReadRoute(),true,event.state?.scrollY));
window.addEventListener('hashchange',()=>{
 if(location.hash.startsWith('#/')&&window.PupilaReadRoute()!==window.PupilaRouteFull)window.PupilaRender(window.PupilaReadRoute(),true);
});
if(window.PupilaParseRoute(window.PupilaRouteFull).anchor){requestAnimationFrame(()=>document.getElementById(window.PupilaParseRoute(window.PupilaRouteFull).anchor)?.scrollIntoView({block:'start',behavior:'instant'}));}
</script><script defer src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script><script defer src="assets/editorial.js"></script></body></html>
